# Netlify deploy config — connect this repo in Netlify and it auto-detects everything below.
[build]
  command = "npm run build"
  publish = "dist"
  ignore = "exit 0"   # 0905 止血(skill netlify-autobuild-stop):Git 觸發的雲端 build 一律取消;正版在 CF Pages(chinese-checker.pages.dev)

[build.environment]
  # Vite 7 requires Node >= 20.19 / 22.12; pin a safe LTS.
  NODE_VERSION = "22"

# Single-page app: serve index.html for any path so deep links / refreshes work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
